<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RDM — Download</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="dialog">
  <div class="sheet-head">
    <div class="badge" id="ext">FILE</div>
    <div style="min-width: 0">
      <div class="sheet-title">Download with RDM</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <div class="form">
    <label for="name">Name</label>
    <input id="name" type="text" spellcheck="false" autocomplete="off">
    <label for="dir">Where</label>
    <div class="picker">
      <select id="dir"></select>
      <button id="choose" type="button">Choose…</button>
    </div>
    <label for="quality" class="video-only" hidden>Quality</label>
    <select id="quality" class="video-only" hidden>
      <option value="best">Best available</option>
      <option value="2160">2160p</option>
      <option value="1440">1440p</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
      <option value="audio">Audio only</option>
    </select>
    <span></span>
    <label class="check"><input type="checkbox" id="start" checked> Start now</label>
  </div>
  <p id="dupe" class="dupe" hidden></p>
  <p id="error" class="error" hidden></p>

  <div class="actions">
    <button id="browser" type="button" class="link">Use Chrome instead</button>
    <span class="spacer"></span>
    <button id="cancel" type="button">Cancel</button>
    <button id="ok" type="button" class="solid">Download<kbd>↵</kbd></button>
  </div>
  <script src="common.js"></script>
  <script src="dialog.js"></script>
</body>
</html>
