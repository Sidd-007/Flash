[package]
name = "rdm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
futures-util = "0.3"
md-5 = "0.10"
percent-encoding = "2"
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
tempfile = "3"
